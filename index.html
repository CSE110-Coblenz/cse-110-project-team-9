<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Game</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 20px;
			}

			#container {
				background: white;
				border: 1px solid #ddd;
				overflow: hidden;
			}
			@font-face {
				font-family: 'HomescreenFont';
				src : url('/fonts/medieval.ttf') format('truetype'), /* Window or Linux */
				      url('/fonts/medievalMac.ttf') format('truetype'); /* MacOS */
			}
		</style>
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
	</head>
	<body>
		<div id="container"></div>
		<script type="module" src="./src/main.ts"></script>
	</body>
</html>
